<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - Lanes</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">Lanes</h2>
    <div class="page-actions">
      <button id="saveAllLanesBtn" class="primary"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Save All Lanes</button>
      <button id="clearChangesBtn"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>Clear Changes</button>
      <button id="addLaneBtn"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Add Lane</button>
    </div>
    <div class="status" id="status"></div>
    <div id="lanes"></div>
  </main>

  <template id="lane-template">
    <div class="lane-card" data-id="">
      <div class="field-row">
        <label><input type="checkbox" class="f-enabled" /> Enabled<span class="help-tag" tabindex="0" title="Whether this lane is included when a run or monitoring pass scans for files.">?<span class="help-tip">Whether this lane is included when a run or monitoring pass scans for files.</span></span></label>
        <input type="text" class="f-displayName" placeholder="Lane name" style="max-width:240px" />
        <button class="save-lane-btn primary">Save</button>
        <button class="remove-lane-btn">Remove</button>
      </div>
      <div class="field-row">
        <label>Input<span class="help-tag" tabindex="0" title="Folder Compressarr scans for video files to convert.">?<span class="help-tip">Folder Compressarr scans for video files to convert.</span></span></label>
        <input type="text" class="f-input" />
        <button class="browse-btn" data-target="f-input">Browse...</button>
        <label>Output<span class="help-tag" tabindex="0" title="Folder converted files are written to, unless &quot;Write output to same folder as input&quot; is enabled in Settings.">?<span class="help-tip">Folder converted files are written to, unless "Write output to same folder as input" is enabled in Settings.</span></span></label>
        <input type="text" class="f-output" />
        <button class="browse-btn" data-target="f-output">Browse...</button>
      </div>
      <div class="field-row">
        <label>TV preset<span class="help-tag" tabindex="0" title="HandBrake preset used for files detected as TV episodes.">?<span class="help-tip">HandBrake preset used for files detected as TV episodes.</span></span></label>
        <select class="f-tvPreset"></select>
        <label>Movie preset<span class="help-tag" tabindex="0" title="HandBrake preset used for files detected as movies.">?<span class="help-tip">HandBrake preset used for files detected as movies.</span></span></label>
        <select class="f-moviePreset"></select>
      </div>
      <div class="field-row">
        <label>Movie destination path<span class="help-tag" tabindex="0" title="Destination folder converted movies are moved into, if Move converted files is enabled in Settings.">?<span class="help-tip">Destination folder converted movies are moved into, if Move converted files is enabled in Settings.</span></span></label>
        <input type="text" class="f-movieBasePath" />
        <button class="browse-btn" data-target="f-movieBasePath">Browse...</button>
        <label>TV destination path<span class="help-tag" tabindex="0" title="Destination folder converted TV episodes are moved into, if Move converted files is enabled in Settings.">?<span class="help-tip">Destination folder converted TV episodes are moved into, if Move converted files is enabled in Settings.</span></span></label>
        <input type="text" class="f-tvShowBasePath" />
        <button class="browse-btn" data-target="f-tvShowBasePath">Browse...</button>
      </div>
    </div>
  </template>

  <script src="/nav.js"></script>
  <script src="/browse.js"></script>
  <script src="/lanes.js"></script>
</body>
</html>
