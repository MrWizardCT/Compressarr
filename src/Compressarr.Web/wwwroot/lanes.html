<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - Lanes</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <div class="field-row">
      <h2 style="flex:1; margin:0;">Lanes</h2>
      <button id="addLaneBtn" class="primary">Add Lane</button>
    </div>
    <div class="status" id="status"></div>
    <div id="lanes"></div>
  </main>

  <template id="lane-template">
    <div class="lane-card" data-id="">
      <div class="field-row">
        <label><input type="checkbox" class="f-enabled" /> Enabled</label>
        <input type="text" class="f-displayName" placeholder="Lane name" style="max-width:240px" />
        <button class="save-lane-btn primary">Save</button>
        <button class="remove-lane-btn">Remove</button>
      </div>
      <div class="field-row">
        <label>Input</label>
        <input type="text" class="f-input" />
        <button class="browse-btn" data-target="f-input">Browse...</button>
        <label>Output</label>
        <input type="text" class="f-output" />
        <button class="browse-btn" data-target="f-output">Browse...</button>
      </div>
      <div class="field-row">
        <label>TV preset</label>
        <input type="text" class="f-tvPreset" list="preset-list" />
        <label>Movie preset</label>
        <input type="text" class="f-moviePreset" list="preset-list" />
      </div>
      <div class="field-row">
        <label>TV base path</label>
        <input type="text" class="f-tvShowBasePath" />
        <button class="browse-btn" data-target="f-tvShowBasePath">Browse...</button>
        <label>Movie base path</label>
        <input type="text" class="f-movieBasePath" />
        <button class="browse-btn" data-target="f-movieBasePath">Browse...</button>
      </div>
    </div>
  </template>
  <datalist id="preset-list"></datalist>

  <script src="/nav.js"></script>
  <script src="/browse.js"></script>
  <script src="/lanes.js"></script>
</body>
</html>
