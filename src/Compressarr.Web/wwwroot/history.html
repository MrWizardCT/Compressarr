<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - History</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">History</h2>
    <div class="page-actions">
      <button id="toggleHistoryBtn">Hide History</button>
      <button id="toggleReportsBtn">Hide Reports</button>
    </div>

    <div class="card" id="historySection">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <h2>Overview</h2>
      </div>
      <div class="card-body">
        <div class="stat-grid">
          <div class="stat"><div class="label">Total Runs</div><div class="value" id="totalRunCount">-</div></div>
        </div>
        <table>
          <thead>
            <tr><th>Period</th><th>Files</th><th>Before</th><th>After</th><th>Saved</th></tr>
          </thead>
          <tbody id="historyRows"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="reportsSection">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <h2>Reports</h2>
      </div>
      <div class="card-body">
        <table>
          <thead>
            <tr><th>Run #</th><th>Report</th><th>Files</th><th>Before</th><th>After</th><th>Saved</th></tr>
          </thead>
          <tbody id="reportsRows"></tbody>
        </table>
        <div class="status" id="reportsStatus"></div>
      </div>
    </div>
  </main>

  <script src="/nav.js"></script>
  <script src="/history.js"></script>
</body>
</html>
