<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - History</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">History</h2>
    <div class="page-actions">
      <button id="toggleHistoryBtn">Hide History</button>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="label">Total Runs</div><div class="value" id="totalRunCount">-</div></div>
    </div>

    <div id="historySection">
      <table>
        <thead>
          <tr><th>Period</th><th>Files</th><th>Before</th><th>After</th><th>Saved</th></tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>

      <h3>Reports</h3>
      <table>
        <thead>
          <tr><th>Run #</th><th>Report</th><th>Files</th><th>Before</th><th>After</th><th>Saved</th></tr>
        </thead>
        <tbody id="reportsRows"></tbody>
      </table>
      <div class="status" id="reportsStatus"></div>
    </div>
  </main>

  <script src="/nav.js"></script>
  <script src="/history.js"></script>
</body>
</html>
