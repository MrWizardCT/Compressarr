<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - Monitor</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">Monitoring</h2>
    <div class="field-row page-actions">
      <button id="startBtn" class="primary">Start Monitoring</button>
      <button id="stopBtn">Stop Monitoring</button>
      <button id="runNowBtn" class="success">Run Now</button>
      <button id="abortBtn" class="danger">Abort</button>
    </div>

    <h2>Current status</h2>
    <div class="status-row">
      <div class="stat stat-state"><div class="label">State</div><div class="value" id="stateValue">Idle</div></div>
      <div class="stat stat-file">
        <div class="label" id="fileLabel">Waiting for files</div>
        <div class="value" id="fileValue">-</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        <div class="stat-sub" id="progressSub"></div>
      </div>
    </div>

    <h2>In Queue</h2>
    <div class="queue-list" id="queueList"></div>

    <h2>Recent log</h2>
    <div id="log-panel"></div>

    <p style="color: var(--text-dim); font-size: 12px; margin-top: 16px;">
      Note: Stop Monitoring finishes the current pass before stopping - it does not abort a
      conversion that's already in progress. Abort kills the current conversion immediately and
      stops monitoring.
    </p>
  </main>

  <script src="/nav.js"></script>
  <script src="/monitor.js"></script>
</body>
</html>
