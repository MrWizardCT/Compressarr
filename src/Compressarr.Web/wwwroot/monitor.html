<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - Monitor</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">Monitoring</h2>
    <div class="field-row page-actions">
      <button id="startBtn" class="primary">Start Monitoring</button>
      <button id="stopBtn">Stop Monitoring</button>
      <button id="runNowBtn" class="success">Run Now</button>
      <button id="abortBtn" class="danger">Abort</button>
      <span id="monitoringState" class="status"></span>
      <span id="countdown" class="countdown"></span>
    </div>

    <h2>Current status</h2>
    <div class="stat-grid">
      <div class="stat"><div class="label">State</div><div class="value" id="stateValue">Idle</div></div>
      <div class="stat"><div class="label">Lane</div><div class="value" id="laneValue">-</div></div>
      <div class="stat"><div class="label">CPU</div><div class="value" id="cpuValue">-</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="label">File</div><div class="value" id="fileValue">-</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="label">Progress</div><div class="value" id="progressValue">-</div></div>
    </div>

    <h2>In Queue</h2>
    <div class="queue-list" id="queueList"></div>

    <h2>Recent log</h2>
    <div id="log-panel"></div>

    <p style="color: var(--text-dim); font-size: 12px; margin-top: 16px;">
      Note: Stop Monitoring finishes the current pass before stopping - it does not abort a
      conversion that's already in progress. Abort kills the current conversion immediately and
      stops monitoring.
    </p>
  </main>

  <script src="/nav.js"></script>
  <script src="/monitor.js"></script>
</body>
</html>
