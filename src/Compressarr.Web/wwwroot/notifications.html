<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Compressarr - Notifications</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">Notifications</h2>

    <div class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <h2>Desktop Toast Notifications</h2>
      </div>
      <div class="card-body">
        <div class="check-row">
          <input type="checkbox" id="toastEnabled" />
          <label for="toastEnabled">Show a Windows toast notification when a run completes</label>
        </div>
        <div class="preset-status" id="toastStatus" style="margin-left: 0"></div>
        <p style="color: var(--text-dim); font-size: 12.5px; margin: 4px 0 0;">
          Off by default - useful on a desktop machine, not needed for a headless/server install.
        </p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
        <h2>Notification Channels</h2>
        <div class="card-head-spacer"></div>
        <select id="addChannelType"></select>
        <button id="addChannelBtn">Add Channel</button>
      </div>
      <div class="card-body">
        <div class="status" id="channelsStatus"></div>
        <div id="channelsList"></div>
      </div>
    </div>
  </main>

  <script src="/nav.js"></script>
  <script src="/notifications.js"></script>
</body>
</html>
